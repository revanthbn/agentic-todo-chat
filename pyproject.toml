[project]
name = "agentic-todo-chat"
version = "0.1.0"
description = "A chat interface for a todo list"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "litellm[mcp]>=1.106.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
