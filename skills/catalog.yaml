# Shown to the model in route(). Names + one line only; full instructions load on demand.
skills:
  - name: add
    description: Create a new todo. Not for rewording a todo that already exists.
  - name: list
    description: Show the current todos, optionally only open or only done ones.
  - name: update
    description: Change the text of an existing todo, including corrections like "make that X", "actually it's X", "change it to X".
  - name: complete
    description: Mark an existing todo as done.
  - name: delete
    description: Remove an existing todo.
